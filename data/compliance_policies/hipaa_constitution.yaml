# HIPAA Compliance Constitution
# Constitutional AI principles for healthcare document compliance

name: "HIPAA Compliance Constitution"
version: "1.0"
last_updated: "2026-04-08"
jurisdiction: "United States - Federal"

# Core Constitutional Principles
constitutional_principles:
  1_patient_privacy_first:
    principle: "Patient Privacy First"
    description: "When uncertain, favor more restrictive access controls to protect patient privacy"
    regulation: "45 CFR §164.502(b) - Minimum Necessary Standard"
    priority: 1

  2_accessibility_vs_security:
    principle: "Balance Accessibility and Security"
    description: "Enable legitimate access for treatment, payment, and healthcare operations while maintaining security"
    regulation: "45 CFR §164.506 - Uses and Disclosures for Treatment, Payment, and Health Care Operations"
    priority: 2

  3_retention_vs_deletion:
    principle: "Retention vs. Deletion Balance"
    description: "Satisfy both legal hold requirements and data minimization principles"
    regulation: "45 CFR §164.530(j) - Retention Requirements"
    priority: 2

  4_transparency_requirement:
    principle: "Transparency and Explainability"
    description: "All compliance decisions must be explainable with specific regulatory citations"
    regulation: "45 CFR §164.526 - Right to Access"
    priority: 1

  5_patient_rights:
    principle: "Protect Patient Rights"
    description: "Ensure patients can access, amend, and receive accounting of disclosures"
    regulation: "45 CFR §164.524-528"
    priority: 1

# Conflict Resolution Rules
conflict_resolution:
  - "Patient safety overrides administrative convenience"
  - "Legal requirements override operational efficiency"
  - "Federal law takes precedence over state law unless state law is more stringent"
  - "In cases of ambiguity, consult compliance officer (human-in-loop)"

# Protected Health Information (PHI) Categories
phi_categories:
  direct_identifiers:
    - "Names (patient, relatives, employers)"
    - "Geographic subdivisions smaller than state"
    - "Dates directly related to patient (birth, admission, discharge, death)"
    - "Phone numbers"
    - "Fax numbers"
    - "Email addresses"
    - "Social Security Numbers"
    - "Medical record numbers"
    - "Health plan beneficiary numbers"
    - "Account numbers"
    - "Certificate/license numbers"
    - "Vehicle identifiers and serial numbers"
    - "Device identifiers and serial numbers"
    - "URLs"
    - "IP addresses"
    - "Biometric identifiers (fingerprints, retinal scans)"
    - "Full-face photographs"
    - "Any other unique identifying number, characteristic, or code"

  clinical_information:
    - "Diagnoses and diagnosis codes (ICD-10)"
    - "Treatment and procedure information"
    - "Medication lists and prescriptions"
    - "Lab results and test values"
    - "Vital signs and measurements"
    - "Clinical notes and assessments"
    - "Mental health and psychotherapy notes"
    - "Substance abuse treatment records"
    - "HIV/AIDS status"
    - "Genetic information"

  sensitive_phi:
    description: "Requires enhanced protection"
    categories:
      - "Psychotherapy notes (45 CFR §164.501)"
      - "Substance abuse treatment records (42 CFR Part 2)"
      - "HIV/AIDS status"
      - "Genetic information"
      - "Mental health diagnoses"
      - "Sexual and reproductive health"

# Access Control Requirements by Role
access_control_matrix:
  physician:
    can_access:
      - "Patient demographics"
      - "Clinical notes"
      - "Lab results"
      - "Medication lists"
      - "Diagnosis codes"
    restrictions:
      - "Psychotherapy notes require explicit authorization"
      - "Substance abuse records require patient consent"

  nurse:
    can_access:
      - "Patient demographics"
      - "Care plans"
      - "Medication administration records"
      - "Vital signs"
    restrictions:
      - "Limited diagnosis information (need-to-know basis)"
      - "No access to psychotherapy notes without authorization"

  billing_staff:
    can_access:
      - "Patient demographics (limited)"
      - "Insurance information"
      - "Diagnosis codes for billing"
      - "Procedure codes"
    restrictions:
      - "No clinical notes access"
      - "No treatment details beyond billing codes"

  researcher:
    can_access:
      - "De-identified data only (Safe Harbor or Expert Determination)"
    restrictions:
      - "No access to 18 HIPAA identifiers without IRB approval"
      - "Limited dataset requires Data Use Agreement"

  patient:
    can_access:
      - "All PHI about themselves (45 CFR §164.524)"
    restrictions:
      - "May be denied access to psychotherapy notes"
      - "May be denied if access would endanger patient or others"

# Retention Schedules
retention_schedules:
  medical_records:
    federal_minimum: "6 years from creation or last use"
    regulation: "45 CFR §164.530(j)(2)"
    state_variations:
      - "California: 7 years minimum"
      - "New York: 6 years minimum"
      - "Texas: 10 years for adult records"
    notes: "Use most restrictive requirement"

  psychotherapy_notes:
    federal_minimum: "6 years from creation or last use"
    special_handling: "Separate from medical record, enhanced access controls"

  audit_logs:
    federal_minimum: "6 years"
    regulation: "45 CFR §164.312(b) - Audit Controls"

  authorization_forms:
    federal_minimum: "6 years from date or last effective date"

  notice_of_privacy_practices:
    federal_minimum: "6 years from creation or last effective date"

# Violation Severity Levels
violation_severity:
  critical:
    description: "Immediate remediation required - high risk of patient harm or regulatory penalty"
    examples:
      - "PHI accessible to unauthorized external parties"
      - "Missing encryption on ePHI in transit"
      - "Psychotherapy notes in general medical record"
      - "Past retention deadline without legal hold"
    max_remediation_time: "24 hours"

  high:
    description: "Remediation required - significant compliance risk"
    examples:
      - "Overly permissive access controls"
      - "Missing audit trail"
      - "PHI in unencrypted email"
      - "Approaching retention deadline"
    max_remediation_time: "7 days"

  medium:
    description: "Remediation recommended - moderate compliance risk"
    examples:
      - "Incomplete metadata"
      - "Missing document classification"
      - "Access logs not regularly reviewed"
    max_remediation_time: "30 days"

  low:
    description: "Best practice improvement"
    examples:
      - "Outdated document formatting"
      - "Inconsistent naming conventions"
    max_remediation_time: "90 days"

# Remediation Actions by Violation Type
remediation_actions:
  unauthorized_access:
    auto_executable: false
    requires_human_review: true
    actions:
      - "Immediately revoke access"
      - "Audit trail review"
      - "Notify security officer"
      - "Incident report required"

  missing_encryption:
    auto_executable: false
    requires_human_review: true
    actions:
      - "Apply encryption"
      - "Audit exposure scope"
      - "Risk assessment"

  overpermissive_access:
    auto_executable: true
    confidence_threshold: 0.8
    actions:
      - "Update access controls to minimum necessary"
      - "Document change in audit log"
      - "Notify document owner"

  retention_violation:
    auto_executable: false
    requires_human_review: true
    actions:
      - "Check for legal hold"
      - "Verify retention schedule"
      - "If eligible: secure deletion"
      - "If not eligible: extend retention with justification"

  missing_metadata:
    auto_executable: true
    confidence_threshold: 0.7
    actions:
      - "Extract metadata from content"
      - "Apply document classification"
      - "Update index"

# Audit Trail Requirements
audit_trail:
  required_fields:
    - "timestamp"
    - "user_id"
    - "action"
    - "document_id"
    - "phi_accessed"
    - "justification"
    - "ip_address"
    - "device_id"

  retention_period: "6 years"

  must_log:
    - "All PHI access"
    - "All PHI modifications"
    - "All PHI disclosures"
    - "Access control changes"
    - "Compliance violations detected"
    - "Remediation actions taken"
